name: Trigger Workflow

on:
   workflow_dispatch:
   push:
     branches:
       - main
     
jobs:
  trigger:
    runs-on: ubuntu-latest

    steps:
    - name: Notify Logic App for latest tags
      run: |
        curl -X POST 'https://prod-115.westeurope.logic.azure.com:443/workflows/03c5351a68be48dcae25a6db77ff12cf/triggers/Receive_Github_Payload/paths/invoke?api-version=2016-10-01&sp=%2Ftriggers%2FReceive_Github_Payload%2Frun&sv=1.0&sig=NXKy8oVx4lIRo-4P6K9PdiqRYysQPDkvqLjBoRoiSA0' \
          -H "Content-Type: application/json" \
          -d '{
            "tag": "rc",
            "image": "ghcr.io/eldensokoli/test-project:rc",
            "sha": "sha256:b595d2730ff2b884f7e280120b7c0ecc58ea53d7a86e8d92ee24bb895eb4e889"
          }'
